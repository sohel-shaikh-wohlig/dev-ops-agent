# Worker Deployment Template (Reference Only)
# This template is dynamically generated by the API based on the secrets configuration.
# The actual manifest is built in _build_worker_manifest() with conditional secrets.
#
# Payload Mapping:
# - worker.name -> WORKER_LANGUAGE_TRANSLATION_NAME (root level in values.yaml)
# - worker.workerType -> config.data.WORKER_LANGUAGE_TRANSLATION (config section)
# - worker.additionalEnv -> Appended to config.data section
#
# Conditional Logic (based on 'secrets' array):
# - If "vertex_ai" in secrets: includes vertex-ai-credentials-volume and GOOGLE_APPLICATION_CREDENTIALS env
# - If "bq" in secrets: includes bq-credentials-volume and BQ_* env vars
# - If neither: removes these volumes and env vars to avoid deployment errors
#
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Values.WORKER_LANGUAGE_TRANSLATION_NAME | quote }}
  annotations:
    repoUrl: {{ .Values.annotations.repoUrl | quote }}
  labels:
    application: {{ .Values.labels.application }}
    env: {{ .Values.labels.env }}
spec:
  replicas: {{ .Values.replicasCount }}
  selector:
    matchLabels:
      app: {{ .Values.WORKER_LANGUAGE_TRANSLATION_NAME | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.WORKER_LANGUAGE_TRANSLATION_NAME | quote }}
      annotations:
        linkerd.io/inject: disabled
    spec:
      containers:
        - name: {{ .Values.WORKER_LANGUAGE_TRANSLATION_NAME | quote }}
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: {{ .Values.config.NODE_ENV | quote }}
            - name: WORKER_TYPE
              value: {{ .Values.config.WORKER_LANGUAGE_TRANSLATION | quote }}
            # Conditional: Only if "vertex_ai" in secrets
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/ai-credentials/credentials.json
            # Conditional: Only if "bq" in secrets
            - name: BQ_DATASET_KEY
              value: /etc/credentials/bq_credentials.json
            - name: BQ_PORTFOLIO_DATASET_KEY
              value: /etc/credentials/bq_avs_credentials.json
          envFrom:
            - configMapRef:
                name: {{ .Values.name }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: db-certs
              mountPath: /app/certs
              readOnly: true
            # Conditional: Only if "vertex_ai" in secrets
            - name: vertex-ai-credentials-volume
              mountPath: /etc/ai-credentials
              readOnly: true
            # Conditional: Only if "bq" in secrets
            - name: bq-credentials-volume
              mountPath: /etc/credentials
              readOnly: true
      volumes:
        # Conditional: Only if "vertex_ai" in secrets
        - name: vertex-ai-credentials-volume
          secret:
            secretName: {{MICRO_SERVICE_NAME}}-ai
            items:
              - key: credentials.json
                path: credentials.json
        # Conditional: Only if "bq" in secrets
        - name: bq-credentials-volume
          secret:
            secretName: {{MICRO_SERVICE_NAME}}-bq-creds
            items:
              - key: bq_credentials.json
                path: bq_credentials.json
              - key: bq_avs_credentials.json
                path: bq_avs_credentials.json
        - name: db-certs
          secret:
            secretName: db-certs
            defaultMode: 400
