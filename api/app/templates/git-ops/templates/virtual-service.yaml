apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.name }}-vs
spec:
  hosts:
    - {{ .Values.virtualhost.fqdn }}
  gateways:
    - {{ .Values.name }}-gateway
  http:
    - corsPolicy:
        allowOrigins:
          - regex: ".*"  # Equivalent to "*"
        allowMethods:
          - GET
          - POST
          - OPTIONS
          - PUT
          - DELETE
          - PATCH
        allowHeaders:
          - "*"
        exposeHeaders:
          - Content-Length
          - Content-Range
        allowCredentials: true
        maxAge: "10m"
      route:
        - destination:
            host: {{ .Values.name }}
            port:
              number: {{ .Values.service.port }}
          weight: 100
      retries:
        attempts: 0  # No automatic retries